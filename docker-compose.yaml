x-env-file: &default_env
  - .env

services:
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile.spark
    container_name: spark-master
    hostname: spark-master
    env_file: *default_env
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080" # Master Web UI
      - "7077:7077" # Master RPC (for worker/driver connection)
    volumes:
      - ./data:/opt/spark/work-dir/data
    networks:
      - amazon_reviews_network

  spark-worker-1:
    build:
      context: ./spark
      dockerfile: Dockerfile.spark
    container_name: spark-worker-1
    hostname: spark-worker-1
    env_file: *default_env
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_WEBUI_PORT=8081
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081" # Worker UI (for first worker)
    depends_on:
      - spark-master
    volumes:
      - ./data:/opt/spark/work-dir/data
    networks:
      - amazon_reviews_network

  spark-worker-2:
    build:
      context: ./spark
      dockerfile: Dockerfile.spark
    container_name: spark-worker-2
    hostname: spark-worker-2
    env_file: *default_env
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_WEBUI_PORT=8081 # each worker uses its own port inside container
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8082:8081" # map host 8082 to worker-2's internal 8081
    depends_on:
      - spark-master
    volumes:
      - ./data:/opt/spark/work-dir/data
    networks:
      - amazon_reviews_network

  mongodb:
    image: bitnami/mongodb:latest
    container_name: mongodb
    env_file: *default_env
    ports:
      - "27017:27017"
    environment:
      - MONGODB_ROOT_USER=${MONGODB_ROOT_USER}
      - MONGODB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
    volumes:
      - mongodb_data:/bitnami/mongodb
    networks:
      - amazon_reviews_network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    env_file: *default_env
    ports:
      - "9090:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=${ME_CONFIG_MONGODB_SERVER}
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGODB_ROOT_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGODB_ROOT_PASSWORD}
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_CONFIG_BASICAUTH_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - amazon_reviews_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    hostname: zookeeper
    env_file: *default_env
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - amazon_reviews_network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    hostname: kafka
    env_file: *default_env
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - amazon_reviews_network
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    env_file: *default_env
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=amazon-reviews-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - amazon_reviews_network
  reviews-producer:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    container_name: kafka-producer
    profiles:
      - producer
    env_file: *default_env
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=reviews.raw
      - TEST_CSV=/app/data/output/test/part-*.csv
      - TEST_LIMIT=0
      - KAFKA_SEND_DELAY=0.01
    depends_on:
      - kafka
    networks:
      - amazon_reviews_network
    volumes:
      - ./data:/app/data:ro
  preprocessing-job:
    build:
      context: ./spark/preprocessing_job
      dockerfile: Dockerfile
    container_name: preprocessing-job
    profiles:
      - preprocessing
    env_file: *default_env
    depends_on:
      spark-master:
        condition: service_started # or service_healthy if healthcheck defined
    networks:
      - amazon_reviews_network
    volumes:
      - ./data:/opt/spark/work-dir/data # to access the CSV
  training-job:
    build:
      context: ./spark/training_job
      dockerfile: Dockerfile
    container_name: training-job
    profiles:
      - training
    env_file: *default_env
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - amazon_reviews_network
    volumes:
      - ./data:/opt/spark/work-dir/data # read train/val, write models + model_insights.json
  evaluation-job:
    build:
      context: ./spark/evaluation_job
      dockerfile: Dockerfile
    container_name: evaluation-job
    profiles:
      - evaluation
    env_file: *default_env
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - amazon_reviews_network
    volumes:
      - ./data:/opt/spark/work-dir/data
  streaming-job:
    build:
      context: ./spark/streaming_job
      dockerfile: Dockerfile
    container_name: streaming-job
    profiles:
      - streaming
    env_file: *default_env
    depends_on:
      - spark-master
      - kafka
      - mongodb
    networks:
      - amazon_reviews_network
    volumes:
      - ./data:/opt/spark/work-dir/data # may be needed if model saved here later
    ports:
      - "4040:4040" # Spark Application UI (Driver)
    restart: unless-stopped
  # ── Airflow Database ──────────────────────────────────────────
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile.airflow
    container_name: airflow
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: "amazon-reviews-2026"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Your project env vars — so DAGs can reach Kafka/MongoDB
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: reviews.raw
      MONGODB_HOST: mongodb
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_ROOT_USER: ${MONGODB_ROOT_USER}
      MONGODB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    command: standalone
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./data:/opt/spark/work-dir/data # Consistent path with spark cluster
      - ./spark:/opt/airflow/spark
      - airflow_home:/opt/airflow # persists SQLite DB + users
    networks:
      - amazon_reviews_network
    depends_on:
      - kafka
      - mongodb
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: backend-api
    ports:
      - "8000:8000"
    env_file: *default_env
    environment:
      - MONGODB_HOST=mongodb
    depends_on:
      - mongodb
    networks:
      - amazon_reviews_network
  # frontend:
  #     build:
  #         context: ./frontend
  #         dockerfile: Dockerfile
  #     container_name: frontend-dashboard
  #     ports:
  #         - "5173:3000"
  #     environment:
  #         - PUBLIC_API_BASE_URL=http://localhost:8000
  #     depends_on:
  #         - backend
  #     networks:
  #         - amazon_reviews_network
volumes:
  mongodb_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  airflow_home: # ← add this
networks:
  amazon_reviews_network:
    driver: bridge
